<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cognira VIM — AI Vendor Invoice Management{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='brand.svg') }}" type="image/svg+xml">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20260906i">
    {% block extra_head %}{% endblock %}
</head>
<body class="public-shell">
    <header class="public-nav">
        <a class="brand" href="{{ url_for('home') }}">
            <img class="brand-mark" src="{{ url_for('static', filename='brand.svg') }}" alt="Cognira">
            <span class="brand-copy">
                <strong>Cognira</strong>
                <small>Invoice Intelligence</small>
            </span>
        </a>
        <nav>
            <ul class="public-nav-links">
                <li><a href="#capabilities">Capabilities</a></li>
                <li><a href="#benefits">Outcomes</a></li>
                <li><a href="{{ url_for('login') }}">Workspace</a></li>
            </ul>
        </nav>
        <div class="public-nav-actions">
            <a class="btn btn-ghost" href="{{ url_for('login') }}">Sign in</a>
            <a class="btn btn-primary" href="{{ url_for('register') }}">Request access</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="public-footer">
        &copy; 2026 Cognira · Vendor Invoice Management · AI extraction, validation, and approval
    </footer>
</body>
</html>
