{% extends 'user_base.html' %}
{% block title %}Request access · Cognira VIM{% endblock %}

{% block content %}
<h2>Request access</h2>
<p class="lede">Vendor accounts are provisioned by an administrator. Submit your details to get started.</p>

<form action="/register" method="POST">
    <div class="mb-3">
        <label for="Username-registration" class="form-label">Full name</label>
        <input type="text" class="form-control" id="Username-registration" placeholder="Jordan Patel" name="name">
    </div>
    <div class="mb-3">
        <label for="Email-registration" class="form-label">Work email</label>
        <input type="email" class="form-control" id="Email-registration" placeholder="you@company.com" name="email">
    </div>
    <div class="mb-3">
        <label for="Address" class="form-label">Address</label>
        <textarea class="form-control" id="Address" rows="3" name="address"></textarea>
    </div>
    <div class="mb-3">
        <label for="Userpincode" class="form-label">PIN code</label>
        <input type="text" class="form-control" id="Userpincode" placeholder="560043" name="pincode">
    </div>
    <div class="mb-3">
        <label for="Password-registration" class="form-label">Password</label>
        <input type="password" class="form-control" id="Password-registration" name="password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Submit request</button>
    <p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</form>
{% endblock %}
