{% extends 'user_base.html' %}
{% block title %}Sign in · Cognira VIM{% endblock %}

{% block content %}
<h2>Welcome back</h2>
<p class="lede">Sign in to the AI invoice workspace.</p>

<form action="/login" method="POST">
    <div class="mb-3">
        <label for="Email-registration" class="form-label">Work email</label>
        <input type="email" class="form-control" id="Email-registration" placeholder="you@company.com" name="email" required>
    </div>
    <div class="mb-3">
        <label for="Password-registration" class="form-label">Password</label>
        <input type="password" class="form-control" id="Password-registration" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Continue</button>
    <p class="auth-switch">Need an account? <a href="{{ url_for('register') }}">Request access</a></p>
</form>
{% endblock %}
