{% extends 'admin_base.html' %}

{% block title %}Edit User{% endblock %}
{% block page_sub %}Update role, vendor mapping, and account status{% endblock %}

{% block content %}
<div class="hub-intro">
    <div>
        <p class="eyebrow" style="color:#6d28d9; border-color:#ddd6fe; background:#f5f3ff;">
            <span class="eyebrow-dot"></span> Directory
        </p>
        <h2>Edit user</h2>
        <p>{{ user.Username }} · {{ user.Email }}</p>
    </div>
    <a href="{{ url_for('admin_user_activities') }}" class="btn btn-secondary">Back to users</a>
</div>

<div class="card">
    <form method="POST">
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">User ID</label>
                <input type="text" class="form-control" value="{{ user.UserID }}" readonly>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">User name</label>
                <input type="text" name="username" class="form-control" value="{{ user.Username }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ user.Email }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Leave blank to keep the current password">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Role</label>
                <select name="role" class="form-control">
                    <option value="vendor" {% if user.Role == 'vendor' %}selected{% endif %}>Vendor user</option>
                    <option value="approver" {% if user.Role == 'approver' %}selected{% endif %}>Approver</option>
                    <option value="admin" {% if user.Role == 'admin' %}selected{% endif %}>Administrator</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Vendor</label>
                <select name="vendor_id" class="form-control">
                    {% for vendor in vendors %}
                    <option value="{{ vendor.VendorID }}"
                        {% if vendor.VendorID == user.VendorID %}selected{% endif %}>
                        {{ vendor.VendorName }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Account status</label>
                <select name="is_active" class="form-control">
                    <option value="1" {% if user.IsActive %}selected{% endif %}>Active</option>
                    <option value="0" {% if not user.IsActive %}selected{% endif %}>Inactive</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Created</label>
                <input type="text" class="form-control"
                       value="{{ user.CreatedDate.strftime('%d-%m-%Y %H:%M') if user.CreatedDate else '' }}"
                       readonly>
            </div>
        </div>
        <div class="dir-toolbar" style="margin-top:8px;">
            <button type="submit" class="btn btn-success">Save changes</button>
            <a href="{{ url_for('admin_user_activities') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
